<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0..1" />

  <title>FormulaX</title>

</head>

<body>

  <!-- container -->

  <section class="container" id="root">

    <!-- header section -->
    <header class="header">

      <!-- logo section in header -->
      <div class="logo">
        <div class="logo-icon">
          X
        </div>
        <span class="logo-name">Formula<span>X</span></span>
      </div>

      <!-- tabs section in header -->
      <div class="tabs">

        <a href="calculator" class="tab">
          <span class="material-symbols-outlined icon">
            calculate
          </span>
          <span>Calculator</span>
        </a>

        <a href="feed" class="tab active">
          <span class="material-symbols-outlined icon">
            home
          </span>
          <span>Feed</span>
        </a>

        <a href="stories" class="tab">
          <span class="material-symbols-outlined icon">
            motion_play
          </span>
          <span>Stories</span>
        </a>
      </div>

      <!-- profile tab section -->
      <div class="profile-tab">
        <div class="profile-tab-box">
          <img src="assets/public/images/profile-pic.jpg" alt=".">
          <a href="#">@ShirPalang</a>
        </div>
      </div>
    </header>

    <!-- stories page -->
    <div class="stories-page">
      <div class="main">
        <h1 class="title">Formula Stories</h1>
        <div class="stories">

          <div class="story add-story">
            <div class="story-body">
              <i>+</i>
              <div class="story-footer">
                <p>Create Story</p>
              </div>
            </div>
          </div>

          <div class="story user-story">
            <div class="story-body">

              <div class="user-pic"></div>

              <p class="math-story">2 + 2 = 4</p>

              <div class="story-footer">
                <p>ShirPalang</p>
              </div>
            </div>
          </div>
          
          <div class="story user-story unseen">
            <div class="story-body">

              <div class="user-pic"></div>

              <p class="math-story">2 + 2 = 4</p>

              <div class="story-footer">
                <p>ShirPalang</p>
              </div>
            </div>
          </div>

        </div>

        <div class="footer-story">
          بدجور کیر میخوام حاجی
        </div>
      </div>
    </div>


  </section>

  <script type="module" src="assets/js/main.js"></script>
</body>

</html>
